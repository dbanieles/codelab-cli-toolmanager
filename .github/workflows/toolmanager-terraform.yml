name: Build & Release Terraform CLI

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: .NET Restore
        run: dotnet restore CodeLab.ToolManager.Cli.Terraform/CodeLab.ToolManager.Cli.Terraform.csproj

      - name: .NET Build
        run: dotnet build CodeLab.ToolManager.Cli.Terraform/CodeLab.ToolManager.Cli.Terraform.csproj --configuration Release --no-restore

      - name: .NET Publish (win-x64)
        run: dotnet publish CodeLab.ToolManager.Cli.Terraform/CodeLab.ToolManager.Cli.Terraform.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tftool-win-x64
          path: ./publish

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./publish/tftool.exe
            ./publish/appsettings.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}